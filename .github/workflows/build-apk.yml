name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Apply patch
        run: git apply .github/ws.patch

      - name: Flutter deps
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        run: bash tooling/build-apk.sh -f arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
